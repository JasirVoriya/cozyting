    <rect x="176" y="81" width="3.5" height="9" rx="1.5" fill="#FF6B79"/>
    <!-- Progress bar -->
    <rect x="26" y="99" width="158" height="4.5" rx="2.2" fill="#2D3546"/>
    <rect x="26" y="99" width="102" height="4.5" rx="2.2" fill="#FF6B79"/>
    <!-- Mini target speaker chips -->
