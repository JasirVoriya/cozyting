<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="hb-dark-title hb-dark-desc">
  <title id="hb-dark-title">MiPlay Sender — Android &amp; iPhone Pure-LAN Casting to Xiaomi Speakers</title>
  <desc id="hb-dark-desc">Clean flat obsidian industrial diagram showing both Android and iPhone casting audio over pure LAN via MiPlay Sender to multiple synchronized Xiaomi / MiPlay speakers.</desc>

  <defs>
    <pattern id="hb-grid-d" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="hb-arr-d" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#FF6B79"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Matte Obsidian Background -->
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="#13161D" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="url(#hb-grid-d)"/>

  <!-- ==================== LEFT: ANDROID & IPHONE SENDERS ==================== -->
  <rect x="44" y="42" width="356" height="276" rx="20" fill="#1B1F29" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
  <text x="222" y="68" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1.2">SENDERS · 双端发送</text>

  <!-- Android Phone -->
  <g transform="translate(82, 92)">
    <rect x="0" y="0" width="120" height="174" rx="20" fill="#0B0D12" stroke="#363D4D" stroke-width="1.5"/>
    <rect x="6" y="6" width="108" height="162" rx="15" fill="#151922"/>
    <!-- Punch-hole camera -->
    <circle cx="60" cy="17" r="3.2" fill="#0B0D12"/>
    <!-- Mini NowPlaying Card -->
    <rect x="16" y="34" width="88" height="62" rx="10" fill="#1E2430" stroke="#2D3546" stroke-width="1.2"/>
    <rect x="24" y="43" width="22" height="22" rx="6" fill="#3DDC84" fill-opacity="0.16"/>
    <path d="M 29 57 A 6 6 0 0 1 41 57 Z" fill="#3DDC84"/>
    <line x1="31.5" y1="51.5" x2="29.5" y2="48.5" stroke="#3DDC84" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="38.5" y1="51.5" x2="40.5" y2="48.5" stroke="#3DDC84" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="52" y="46" width="42" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="52" y="56" width="28" height="4.5" rx="2.2" fill="#64748B"/>
    <!-- Equalizer bars -->
    <rect x="24" y="77" width="4" height="10" rx="2" fill="#FF6B79"/>
    <rect x="31" y="73" width="4" height="14" rx="2" fill="#FF6B79"/>
    <rect x="38" y="79" width="4" height="8" rx="2" fill="#FF6B79"/>
    <rect x="52" y="79" width="42" height="5" rx="2.5" fill="#2D3546"/>
    <rect x="52" y="79" width="26" height="5" rx="2.5" fill="#FF6B79"/>
    <!-- Platform Pill -->
    <rect x="18" y="114" width="84" height="24" rx="12" fill="#064E3B" fill-opacity="0.55" stroke="#3DDC84" stroke-opacity="0.55" stroke-width="1"/>
    <text x="60" y="130" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#6EE7B7">Android</text>
    <text x="60" y="155" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8">API 29–36</text>
  </g>

  <!-- iPhone -->
  <g transform="translate(242, 92)">
    <rect x="0" y="0" width="120" height="174" rx="22" fill="#0B0D12" stroke="#363D4D" stroke-width="1.5"/>
    <rect x="6" y="6" width="108" height="162" rx="17" fill="#151922"/>
    <!-- Dynamic Island -->
    <rect x="44" y="13" width="32" height="8" rx="4" fill="#0B0D12"/>
    <!-- Mini NowPlaying Card -->
    <rect x="16" y="34" width="88" height="62" rx="10" fill="#1E2430" stroke="#2D3546" stroke-width="1.2"/>
    <rect x="24" y="43" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.10"/>
    <path d="M 37.8 54.4 C 37.8 52.7 39.2 51.8 39.3 51.7 C 38.5 50.5 37.2 50.4 36.8 50.3 C 35.7 50.2 34.7 50.9 34.2 50.9 C 33.7 50.9 32.8 50.3 32.0 50.3 C 30.8 50.3 29.8 51.0 29.2 52.0 C 28.0 54.1 28.9 57.2 30.1 58.9 C 30.7 59.7 31.4 60.6 32.3 60.6 C 33.2 60.6 33.5 60.0 34.6 60.0 C 35.7 60.0 36.0 60.6 36.9 60.6 C 37.9 60.6 38.5 59.7 39.0 58.9 C 39.7 57.9 40.0 57.0 40.0 56.9 C 39.9 56.9 37.8 56.1 37.8 54.4 Z" fill="#F1F5F9"/>
    <path d="M 36.1 49.0 C 36.6 48.4 36.9 47.6 36.8 46.8 C 36.1 46.8 35.2 47.3 34.7 47.9 C 34.3 48.4 33.9 49.2 34.0 50.0 C 34.8 50.1 35.6 49.6 36.1 49.0 Z" fill="#F1F5F9"/>
    <rect x="52" y="46" width="42" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="52" y="56" width="28" height="4.5" rx="2.2" fill="#64748B"/>
    <!-- Equalizer bars -->
    <rect x="24" y="79" width="4" height="8" rx="2" fill="#FF6B79"/>
    <rect x="31" y="73" width="4" height="14" rx="2" fill="#FF6B79"/>
    <rect x="38" y="76" width="4" height="11" rx="2" fill="#FF6B79"/>
    <rect x="52" y="79" width="42" height="5" rx="2.5" fill="#2D3546"/>
    <rect x="52" y="79" width="26" height="5" rx="2.5" fill="#FF6B79"/>
    <!-- Platform Pill -->
    <rect x="18" y="114" width="84" height="24" rx="12" fill="#262C3A" stroke="#475569" stroke-width="1"/>
    <text x="60" y="130" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#F1F5F9">iPhone</text>
    <text x="60" y="155" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8">iOS · FFI Ready</text>
  </g>

  <text x="222" y="298" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">安卓 &amp; 苹果手机均可投送</text>

  <!-- ==================== FLOW LINES ==================== -->
  <path d="M 400 180 L 534 180" fill="none" stroke="#FF6B79" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#hb-arr-d)"/>
  <rect x="424" y="142" width="90" height="24" rx="12" fill="#351820" stroke="#FF6B79" stroke-opacity="0.5" stroke-width="1"/>
  <text x="469" y="158" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FDA4AF">AAC 48kHz</text>

  <path d="M 744 180 L 876 180" fill="none" stroke="#FF6B79" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#hb-arr-d)"/>
  <rect x="762" y="142" width="96" height="24" rx="12" fill="#351820" stroke="#FF6B79" stroke-opacity="0.5" stroke-width="1"/>
  <text x="810" y="158" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FDA4AF">纯局域网同频</text>

  <!-- ==================== CENTER: MIPLAY SENDER HUB ==================== -->
  <g transform="translate(544, 62)">
    <rect x="0" y="0" width="192" height="236" rx="22" fill="#1B1F29" stroke="#FF6B79" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Brand Logo Mark (92x92 centered at x=50, y=22) -->
    <g transform="translate(50, 22) scale(0.1796875)">
      <rect x="2" y="2" width="508" height="508" rx="115" fill="#15171E" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"/>
      <circle cx="226" cy="256" r="110" fill="#363C49"/>
      <circle cx="226" cy="256" r="93" fill="#101218"/>
      <circle cx="226" cy="256" r="72" fill="#242934"/>
      <circle cx="226" cy="256" r="42" fill="#FF6B79"/>
      <path d="M 214.5 240.5 L 214.5 271.5 Q 214.5 279.5 222.0 275.2 L 247.0 260.3 Q 254.5 256 247.0 251.7 L 222.0 236.8 Q 214.5 232.5 214.5 240.5 Z" fill="#FFFFFF"/>
      <path d="M 327.6 147.0 A 149 149 0 0 1 327.6 365.0" fill="none" stroke="#FF6B79" stroke-width="38" stroke-linecap="round"/>
    </g>

    <text x="96" y="142" text-anchor="middle" class="sans" font-size="18.5" font-weight="800" fill="#F8FAFC" letter-spacing="-0.3">MiPlay Sender</text>
    <text x="96" y="164" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#94A3B8">Rust L1 Core · 零云端</text>

    <rect x="24" y="182" width="144" height="28" rx="14" fill="#FF6B79" fill-opacity="0.16" stroke="#FF6B79" stroke-opacity="0.55" stroke-width="1"/>
    <text x="96" y="200" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FDA4AF">PURE LAN · SYNC</text>
  </g>

  <!-- ==================== RIGHT: XIAOMI / MIPLAY SPEAKERS ==================== -->
  <rect x="886" y="42" width="350" height="276" rx="20" fill="#1B1F29" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
  <text x="1061" y="68" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1.2">RECEIVERS · 小米音箱集群</text>

  <!-- Left Compact Speaker -->
  <g transform="translate(920, 128)">
    <rect x="0" y="0" width="76" height="126" rx="18" fill="#262C3A" stroke="#3B4356" stroke-width="1.5"/>
    <ellipse cx="38" cy="14" rx="26" ry="5" fill="#32394A" stroke="#475569" stroke-width="1"/>
    <circle cx="38" cy="14" r="3" fill="#FF6B79"/>
    <line x1="16" y1="42" x2="60" y2="42" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="54" x2="60" y2="54" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="66" x2="60" y2="66" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="78" x2="60" y2="78" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="90" x2="60" y2="90" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="102" x2="60" y2="102" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="38" y="146" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#94A3B8">音箱 #1</text>
  </g>

  <!-- Center Hero Speaker -->
  <g transform="translate(1013, 108)">
    <rect x="0" y="0" width="96" height="146" rx="20" fill="#0E1117" stroke="#3B4356" stroke-width="1.5"/>
    <ellipse cx="48" cy="16" rx="34" ry="6.5" fill="#1F2430"/>
    <ellipse cx="48" cy="16" rx="20" ry="3.5" fill="none" stroke="#FF6B79" stroke-width="2"/>
    <circle cx="48" cy="72" r="24" fill="#181C26" stroke="#363D4D" stroke-width="1.5"/>
    <circle cx="48" cy="72" r="14" fill="#272D3B"/>
    <circle cx="48" cy="72" r="5" fill="#FF6B79"/>
    <rect x="26" y="114" width="44" height="4" rx="2" fill="#2D3546"/>
    <rect x="34" y="124" width="28" height="4" rx="2" fill="#2D3546"/>
    <text x="48" y="166" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E2E8F0">小爱 / Xiaomi Sound</text>
  </g>

  <!-- Right Compact Speaker -->
  <g transform="translate(1126, 128)">
    <rect x="0" y="0" width="76" height="126" rx="18" fill="#262C3A" stroke="#3B4356" stroke-width="1.5"/>
    <ellipse cx="38" cy="14" rx="26" ry="5" fill="#32394A" stroke="#475569" stroke-width="1"/>
    <circle cx="38" cy="14" r="3" fill="#FF6B79"/>
    <line x1="16" y1="42" x2="60" y2="42" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="54" x2="60" y2="54" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="66" x2="60" y2="66" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="78" x2="60" y2="78" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="90" x2="60" y2="90" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="102" x2="60" y2="102" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="38" y="146" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#94A3B8">音箱 #N</text>
  </g>

  <!-- Sound waves above center speaker (generous clearance below header) -->
  <path d="M 1040 99 A 24 24 0 0 1 1082 99" fill="none" stroke="#FF6B79" stroke-width="2.4" stroke-linecap="round" opacity="0.92"/>
  <path d="M 1031 91 A 36 36 0 0 1 1091 91" fill="none" stroke="#FF6B79" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <text x="1061" y="298" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">单台 / 多台同频投送（上限 63 台）</text>
</svg>
