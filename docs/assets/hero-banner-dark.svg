<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="hb-dark-title hb-dark-desc">
  <title id="hb-dark-title">CozyTing (窝爱听) — Mobile App on Android &amp; iPhone Direct Pure-LAN Casting via MiPlay</title>
  <desc id="hb-dark-desc">Clean flat obsidian diagram showing CozyTing (窝爱听) installed directly on Android and iPhone phones, casting audio over pure LAN via the MiPlay protocol directly to synchronized Xiaomi speakers with zero gateway or server.</desc>

  <defs>
    <pattern id="hb-grid-d" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="hb-arr-d" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#FF6B79"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Matte Obsidian Background -->
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="#13161D" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="url(#hb-grid-d)"/>

  <!-- ==================== LEFT: PHONE · INSTALL COZYTING APP ==================== -->
  <rect x="36" y="28" width="516" height="304" rx="22" fill="#1B1F29" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="294" y="54" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1.1">PHONE · 安装 窝爱听 (COZYTING) APP</text>

  <!-- Android Phone (x=66, y=68, w=210, h=218) -->
  <g transform="translate(66, 68)">
    <!-- Phone Hardware Bezel -->
    <rect x="0" y="0" width="210" height="218" rx="24" fill="#0B0D12" stroke="#3B4356" stroke-width="1.8"/>
    <!-- Screen -->
    <rect x="7" y="7" width="196" height="204" rx="18" fill="#141822"/>
    <!-- Punch-hole Camera -->
    <circle cx="105" cy="18" r="3.4" fill="#0B0D12"/>

    <!-- CozyTing App Header INSIDE screen -->
    <g transform="translate(18, 30)">
      <!-- Mini Brand Logo (28x28) -->
      <g transform="scale(0.0546875)">
        <rect x="2" y="2" width="508" height="508" rx="115" fill="#15171E" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10"/>
        <circle cx="226" cy="256" r="110" fill="#363C49"/>
        <circle cx="226" cy="256" r="93" fill="#101218"/>
        <circle cx="226" cy="256" r="72" fill="#242934"/>
        <circle cx="226" cy="256" r="42" fill="#FF6B79"/>
        <path d="M 214.5 240.5 L 214.5 271.5 Q 214.5 279.5 222.0 275.2 L 247.0 260.3 Q 254.5 256 247.0 251.7 L 222.0 236.8 Q 214.5 232.5 214.5 240.5 Z" fill="#FFFFFF"/>
        <path d="M 327.6 147.0 A 149 149 0 0 1 327.6 365.0" fill="none" stroke="#FF6B79" stroke-width="38" stroke-linecap="round"/>
      </g>
      <text x="36" y="13" class="sans" font-size="11.5" font-weight="800" fill="#F8FAFC">窝爱听 · CozyTing</text>
      <text x="36" y="26" class="mono" font-size="9" font-weight="600" fill="#94A3B8">APP · 单 App 捕获</text>
    </g>

    <!-- Casting Status Card INSIDE screen -->
    <rect x="16" y="68" width="178" height="68" rx="12" fill="#1C2230" stroke="#FF6B79" stroke-opacity="0.42" stroke-width="1.2"/>
    <circle cx="28" cy="84" r="3" fill="#FF6B79"/>
    <text x="37" y="88" class="sans" font-size="11" font-weight="700" fill="#F1F5F9">正在投送</text>
    <!-- Equalizer bars -->
    <rect x="158" y="81" width="3.5" height="9" rx="1.5" fill="#FF6B79"/>
    <rect x="164" y="76" width="3.5" height="14" rx="1.5" fill="#FF6B79"/>
    <rect x="170" y="79" width="3.5" height="11" rx="1.5" fill="#FF6B79"/>
    <rect x="176" y="83" width="3.5" height="7" rx="1.5" fill="#FF6B79" opacity="0.75"/>
    <!-- Progress bar -->
    <rect x="26" y="99" width="158" height="4.5" rx="2.2" fill="#2D3546"/>
    <rect x="26" y="99" width="102" height="4.5" rx="2.2" fill="#FF6B79"/>
    <!-- Mini target speaker chips -->
    <rect x="26" y="111" width="76" height="17" rx="8.5" fill="#351820" stroke="#FF6B79" stroke-opacity="0.45" stroke-width="0.9"/>
    <text x="64" y="122.5" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#FDA4AF">✓ 小爱 Sound</text>
    <rect x="108" y="111" width="60" height="17" rx="8.5" fill="#351820" stroke="#FF6B79" stroke-opacity="0.45" stroke-width="0.9"/>
    <text x="138" y="122.5" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#FDA4AF">✓ 音箱 #1</text>

    <!-- Platform Pill INSIDE phone -->
    <rect x="24" y="148" width="162" height="26" rx="13" fill="#064E3B" fill-opacity="0.52" stroke="#3DDC84" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M 52 163.5 A 5.5 5.5 0 0 1 63 163.5 Z" fill="#3DDC84"/>
    <line x1="54.2" y1="158.5" x2="52.5" y2="155.8" stroke="#3DDC84" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="60.8" y1="158.5" x2="62.5" y2="155.8" stroke="#3DDC84" stroke-width="1.3" stroke-linecap="round"/>
    <text x="115" y="165" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#6EE7B7">Android</text>
    <text x="105" y="191" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8">API 29–36</text>
    <!-- Home indicator -->
    <rect x="78" y="202" width="54" height="3.2" rx="1.6" fill="#3B4356"/>
  </g>

  <!-- iPhone (x=312, y=68, w=210, h=218) -->
  <g transform="translate(312, 68)">
    <!-- Phone Hardware Bezel -->
    <rect x="0" y="0" width="210" height="218" rx="26" fill="#0B0D12" stroke="#3B4356" stroke-width="1.8"/>
    <!-- Screen -->
