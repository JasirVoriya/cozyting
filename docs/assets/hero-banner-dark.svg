    <rect x="108" y="111" width="60" height="17" rx="8.5" fill="#351820" stroke="#FF6B79" stroke-opacity="0.45" stroke-width="0.9"/>
    <text x="138" y="122.5" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#FDA4AF">✓ 音箱 #N</text>

    <!-- Platform Pill INSIDE phone -->
    <rect x="24" y="148" width="162" height="26" rx="13" fill="#242B39" stroke="#475569" stroke-width="1"/>
    <path d="M 62.8 161.4 C 62.8 159.8 64.1 159.0 64.2 158.9 C 63.4 157.8 62.2 157.7 61.8 157.6 C 60.8 157.5 59.9 158.2 59.4 158.2 C 58.9 158.2 58.1 157.6 57.3 157.6 C 56.2 157.6 55.2 158.3 54.7 159.2 C 53.6 161.2 54.4 164.1 55.5 165.7 C 56.1 166.5 56.8 167.3 57.6 167.3 C 58.4 167.3 58.7 166.8 59.8 166.8 C 60.8 166.8 61.1 167.3 61.9 167.3 C 62.8 167.3 63.4 166.5 63.9 165.7 C 64.5 164.8 64.8 163.9 64.8 163.8 C 64.7 163.8 62.8 163.0 62.8 161.4 Z" fill="#F1F5F9"/>
    <path d="M 61.2 156.4 C 61.7 155.8 62.0 155.1 61.9 154.3 C 61.2 154.3 60.4 154.8 59.9 155.4 C 59.5 155.8 59.1 156.6 59.2 157.3 C 60.0 157.4 60.7 156.9 61.2 156.4 Z" fill="#F1F5F9"/>
