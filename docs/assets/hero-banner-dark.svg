    <ellipse cx="38" cy="14" rx="26" ry="5" fill="#32394A" stroke="#475569" stroke-width="1"/>
    <circle cx="38" cy="14" r="3" fill="#FF6B79"/>
    <line x1="16" y1="42" x2="60" y2="42" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="54" x2="60" y2="54" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="66" x2="60" y2="66" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="78" x2="60" y2="78" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="90" x2="60" y2="90" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="102" x2="60" y2="102" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="38" y="146" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#94A3B8">音箱 #1</text>
