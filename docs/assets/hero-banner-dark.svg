    <line x1="16" y1="102" x2="60" y2="102" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="38" y="146" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#94A3B8">音箱 #N</text>
