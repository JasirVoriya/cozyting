  <text x="294" y="313" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">内置 Rust L1 Core · 无需额外网关 / 服务端</text>

  <!-- ==================== CENTER: DIRECT PURE-LAN STREAM (ZERO GATEWAY) ==================== -->
  <path d="M 562 180 L 836 180" fill="none" stroke="#FF6B79" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#hb-arr-d)"/>
  <rect x="605" y="135" width="188" height="27" rx="13.5" fill="#351820" stroke="#FF6B79" stroke-opacity="0.55" stroke-width="1"/>
  <text x="699" y="152.5" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#FDA4AF">纯局域网直连 · 零网关</text>
  <text x="699" y="207" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#CBD5E1">AAC 48kHz · 毫秒级同频</text>
  <text x="699" y="227" text-anchor="middle" class="sans" font-size="10.5" fill="#94A3B8">手机直推音箱 · 零云端</text>

  <!-- ==================== RIGHT: XIAOMI / MIPLAY SPEAKERS ==================== -->
  <rect x="850" y="28" width="394" height="304" rx="22" fill="#1B1F29" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="1047" y="54" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#94A3B8" letter-spacing="1.2">RECEIVERS · 小米音箱集群</text>

