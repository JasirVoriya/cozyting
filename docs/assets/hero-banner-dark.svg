  <!-- Sound waves above center speaker -->
  <path d="M 1026 97 A 24 24 0 0 1 1068 97" fill="none" stroke="#FF6B79" stroke-width="2.4" stroke-linecap="round" opacity="0.92"/>
  <path d="M 1017 89 A 36 36 0 0 1 1077 89" fill="none" stroke="#FF6B79" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

