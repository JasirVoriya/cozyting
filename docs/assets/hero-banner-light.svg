<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="hb-light-title hb-light-desc">
  <title id="hb-light-title">MiPlay Sender — Mobile App Pure-LAN Casting to Xiaomi Speakers</title>
  <desc id="hb-light-desc">Clean flat light-theme diagram showing MiPlay Sender installed directly on Android or iPhone, capturing a single music app locally and streaming AAC 48kHz over pure LAN directly to synchronized Xiaomi / MiPlay speakers with zero gateway or cloud.</desc>

  <defs>
    <pattern id="hb-grid-l" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0F172A" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="hb-arr-l" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#FF5C6C"/>
    </marker>
    <marker id="hb-arr-sm-l" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 Z" fill="#FF5C6C"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Ceramic Background -->
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="#F8F9FB" stroke="#0F172A" stroke-opacity="0.09" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="url(#hb-grid-l)"/>

  <!-- ==================== LEFT: PHONE (WITH MIPLAY SENDER APP INSTALLED) ==================== -->
  <rect x="36" y="32" width="588" height="296" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.09" stroke-width="1.5"/>
  <text x="330" y="58" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="1.1">ON YOUR PHONE · 手机端安装 MIPLAY SENDER APP</text>

  <!-- Sub-card 1: Source Music App inside the phone -->
  <g transform="translate(58, 78)">
    <rect x="0" y="0" width="202" height="174" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.3"/>
    <!-- Mini NowPlaying Card -->
    <rect x="14" y="16" width="174" height="62" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Music Note Badge -->
    <rect x="24" y="26" width="32" height="32" rx="8" fill="#FFF0F2"/>
    <path d="M 36 47 L 36 35 L 47 33 L 47 45" fill="none" stroke="#FF5C6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33.5" cy="47.5" r="2.6" fill="#FF5C6C"/>
    <circle cx="44.5" cy="45.5" r="2.6" fill="#FF5C6C"/>
    <!-- Track lines -->
    <rect x="65" y="31" width="84" height="6" rx="3" fill="#1E2430"/>
    <rect x="65" y="42" width="52" height="4.5" rx="2.2" fill="#94A3B8"/>
    <!-- Mini progress + eq -->
    <rect x="65" y="54" width="110" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="65" y="54" width="68" height="4" rx="2" fill="#FF5C6C"/>
    <rect x="24" y="65" width="3.5" height="6" rx="1.5" fill="#FF5C6C" opacity="0.75"/>
    <rect x="30" y="62" width="3.5" height="9" rx="1.5" fill="#FF5C6C"/>
    <rect x="36" y="64" width="3.5" height="7" rx="1.5" fill="#FF5C6C" opacity="0.85"/>

    <text x="101" y="106" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#14171F">任意音乐 App</text>
    <text x="101" y="126" text-anchor="middle" class="sans" font-size="11" fill="#64748B">网易云 / QQ / Apple Music</text>

    <rect x="37" y="139" width="128" height="22" rx="11" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="101" y="154" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#334155">手机本地音源进程</text>
  </g>

  <!-- Internal Capture Arrow (inside the phone) -->
  <path d="M 264 165 L 340 165" fill="none" stroke="#FF5C6C" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#hb-arr-sm-l)"/>
  <rect x="266" y="132" width="76" height="22" rx="11" fill="#FFF0F2" stroke="#FF5C6C" stroke-opacity="0.45" stroke-width="1"/>
  <text x="304" y="147" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#D93848">单 App 捕获</text>
  <text x="304" y="185" text-anchor="middle" class="sans" font-size="9.5" fill="#64748B">不录屏 · 无麦</text>

  <!-- Sub-card 2: MiPlay Sender App (installed on the same phone) -->
  <g transform="translate(348, 78)">
    <rect x="0" y="0" width="254" height="174" rx="16" fill="#FFFFFF" stroke="#FF5C6C" stroke-opacity="0.45" stroke-width="1.8"/>
    <!-- Top-right APP pill -->
    <rect x="200" y="12" width="42" height="20" rx="10" fill="#FFF0F2" stroke="#FF5C6C" stroke-opacity="0.45" stroke-width="1"/>
    <text x="221" y="26" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#D93848">APP</text>

    <!-- Brand Logo Mark (56x56 at x=16, y=18) -->
    <g transform="translate(16, 18) scale(0.109375)">
      <rect x="2" y="2" width="508" height="508" rx="115" fill="#F8F9FB" stroke="#0F172A" stroke-opacity="0.12" stroke-width="6"/>
      <circle cx="226" cy="256" r="110" fill="#272B35"/>
      <circle cx="226" cy="256" r="93" fill="#151820"/>
      <circle cx="226" cy="256" r="72" fill="#2C313D"/>
      <circle cx="226" cy="256" r="42" fill="#FF5C6C"/>
      <path d="M 214.5 240.5 L 214.5 271.5 Q 214.5 279.5 222.0 275.2 L 247.0 260.3 Q 254.5 256 247.0 251.7 L 222.0 236.8 Q 214.5 232.5 214.5 240.5 Z" fill="#FFFFFF"/>
      <path d="M 327.6 147.0 A 149 149 0 0 1 327.6 365.0" fill="none" stroke="#FF5C6C" stroke-width="38" stroke-linecap="round"/>
    </g>

    <text x="84" y="44" class="sans" font-size="16.5" font-weight="800" fill="#14171F" letter-spacing="-0.2">MiPlay Sender</text>
    <text x="84" y="64" class="mono" font-size="10" font-weight="600" fill="#64748B">内置 Rust L1 Core</text>

    <!-- Divider -->
    <line x1="16" y1="88" x2="238" y2="88" stroke="#0F172A" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Feature rows inside the app -->
    <circle cx="24" cy="112" r="3" fill="#FF5C6C"/>
    <text x="35" y="116" class="sans" font-size="11.5" font-weight="500" fill="#334155">严格按 UID 过滤捕获 · 本机可静音</text>

    <circle cx="24" cy="136" r="3" fill="#FF5C6C"/>
    <text x="35" y="140" class="sans" font-size="11.5" font-weight="500" fill="#334155">手机本地 AAC 48kHz 编码 · 零云端</text>

    <text x="127" y="162" text-anchor="middle" class="mono" font-size="9.5" fill="#94A3B8">直接安装在手机上，无需外置网关</text>
  </g>

  <!-- Bottom Platform Bar inside Phone Container (Android & iPhone) -->
  <g transform="translate(106, 272)">
    <!-- Android Pill -->
    <rect x="0" y="0" width="212" height="32" rx="16" fill="#ECFDF5" stroke="#3DDC84" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M 20 19 A 6 6 0 0 1 32 19 Z" fill="#16A34A"/>
    <line x1="22.5" y1="13.5" x2="20.5" y2="10.5" stroke="#16A34A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="29.5" y1="13.5" x2="31.5" y2="10.5" stroke="#16A34A" stroke-width="1.4" stroke-linecap="round"/>
    <text x="118" y="20.5" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#15803D">Android · API 29–36</text>

    <!-- iPhone Pill -->
    <rect x="234" y="0" width="214" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <path d="M 259.8 16.4 C 259.8 14.7 261.2 13.8 261.3 13.7 C 260.5 12.5 259.2 12.4 258.8 12.3 C 257.7 12.2 256.7 12.9 256.2 12.9 C 255.7 12.9 254.8 12.3 254.0 12.3 C 252.8 12.3 251.8 13.0 251.2 14.0 C 250.0 16.1 250.9 19.2 252.1 20.9 C 252.7 21.7 253.4 22.6 254.3 22.6 C 255.2 22.6 255.5 22.0 256.6 22.0 C 257.7 22.0 258.0 22.6 258.9 22.6 C 259.9 22.6 260.5 21.7 261.0 20.9 C 261.7 19.9 262.0 19.0 262.0 18.9 C 261.9 18.9 259.8 18.1 259.8 16.4 Z" fill="#1E2430"/>
    <path d="M 258.1 11.0 C 258.6 10.4 258.9 9.6 258.8 8.8 C 258.1 8.8 257.2 9.3 256.7 9.9 C 256.3 10.4 255.9 11.2 256.0 12.0 C 256.8 12.1 257.6 11.6 258.1 11.0 Z" fill="#1E2430"/>
    <text x="352" y="20.5" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#1E2430">iPhone · iOS FFI Ready</text>
  </g>

  <!-- ==================== CENTER: DIRECT PURE-LAN STREAM (NO GATEWAY) ==================== -->
  <path d="M 632 180 L 862 180" fill="none" stroke="#FF5C6C" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#hb-arr-l)"/>
  <rect x="656" y="136" width="184" height="26" rx="13" fill="#FFF0F2" stroke="#FF5C6C" stroke-opacity="0.45" stroke-width="1"/>
  <text x="748" y="153" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#D93848">纯局域网直连 · 零网关</text>
  <text x="748" y="206" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#334155">AAC 48kHz · 毫秒级同频</text>
  <text x="748" y="226" text-anchor="middle" class="sans" font-size="10.5" fill="#64748B">手机直推音箱 · 无需中转服务</text>

  <!-- ==================== RIGHT: XIAOMI / MIPLAY SPEAKERS ==================== -->
  <rect x="876" y="32" width="368" height="296" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.09" stroke-width="1.5"/>
  <text x="1060" y="58" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="1.2">RECEIVERS · 小米音箱集群</text>

  <!-- Left Compact Speaker -->
  <g transform="translate(918, 126)">
    <rect x="0" y="0" width="76" height="126" rx="18" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <ellipse cx="38" cy="14" rx="26" ry="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="38" cy="14" r="3" fill="#FF5C6C"/>
    <line x1="16" y1="42" x2="60" y2="42" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="54" x2="60" y2="54" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="66" x2="60" y2="66" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="78" x2="60" y2="78" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="90" x2="60" y2="90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="102" x2="60" y2="102" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <text x="38" y="146" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#64748B">音箱 #1</text>
  </g>

  <!-- Center Hero Speaker -->
  <g transform="translate(1012, 106)">
    <rect x="0" y="0" width="96" height="146" rx="20" fill="#1E2430"/>
    <ellipse cx="48" cy="16" rx="34" ry="6.5" fill="#2C3342"/>
    <ellipse cx="48" cy="16" rx="20" ry="3.5" fill="none" stroke="#FF5C6C" stroke-width="2"/>
    <circle cx="48" cy="72" r="24" fill="#151820" stroke="#363D4D" stroke-width="1.5"/>
    <circle cx="48" cy="72" r="14" fill="#272D3B"/>
    <circle cx="48" cy="72" r="5" fill="#FF5C6C"/>
    <rect x="26" y="114" width="44" height="4" rx="2" fill="#363D4D"/>
    <rect x="34" y="124" width="28" height="4" rx="2" fill="#363D4D"/>
    <text x="48" y="166" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#1E2430">小爱 / Xiaomi Sound</text>
  </g>

  <!-- Right Compact Speaker -->
  <g transform="translate(1126, 126)">
    <rect x="0" y="0" width="76" height="126" rx="18" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <ellipse cx="38" cy="14" rx="26" ry="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="38" cy="14" r="3" fill="#FF5C6C"/>
    <line x1="16" y1="42" x2="60" y2="42" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="54" x2="60" y2="54" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="66" x2="60" y2="66" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="78" x2="60" y2="78" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="90" x2="60" y2="90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="16" y1="102" x2="60" y2="102" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <text x="38" y="146" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#64748B">音箱 #N</text>
  </g>

  <!-- Sound waves above center speaker -->
  <path d="M 1039 97 A 24 24 0 0 1 1081 97" fill="none" stroke="#FF5C6C" stroke-width="2.4" stroke-linecap="round" opacity="0.88"/>
  <path d="M 1030 89 A 36 36 0 0 1 1090 89" fill="none" stroke="#FF5C6C" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <text x="1060" y="302" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#334155">单台 / 多台同频投送（上限 63 台）</text>
</svg>
