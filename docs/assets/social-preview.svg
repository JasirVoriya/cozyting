<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">MiaoCast (妙投) — Pure LAN Multi-Room Audio via MiPlay</title>
  <desc id="sp-desc">GitHub Social Preview card for MiaoCast in clean flat industrial ceramic aesthetic.</desc>

  <!-- Ceramic light background -->
  <rect width="1280" height="640" fill="#F4F6FA"/>

  <!-- Subtle architectural dot/line grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F172A" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Main framed ceramic card -->
  <rect x="56" y="56" width="1168" height="528" rx="32" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Subtle left coral accent bar (Braun-style restraint) -->
  <rect x="56" y="136" width="6" height="368" rx="3" fill="#FF5C6C"/>

  <!-- Left brand icon mark (216x216 at x=122, y=156) -->
  <g transform="translate(122 156) scale(0.421875)">
    <rect x="2" y="2" width="508" height="508" rx="115" fill="#F8F9FB" stroke="#0F172A" stroke-opacity="0.10" stroke-width="4"/>
    <circle cx="226" cy="256" r="110" fill="#272B35"/>
    <circle cx="226" cy="256" r="93" fill="#151820"/>
    <circle cx="226" cy="256" r="72" fill="#2C313D"/>
    <circle cx="226" cy="256" r="42" fill="#FF5C6C"/>
    <path d="M 214.5 240.5 L 214.5 271.5 Q 214.5 279.5 222.0 275.2 L 247.0 260.3 Q 254.5 256 247.0 251.7 L 222.0 236.8 Q 214.5 232.5 214.5 240.5 Z" fill="#FFFFFF"/>
    <path d="M 327.6 147.0 A 149 149 0 0 1 327.6 365.0" fill="none" stroke="#FF5C6C" stroke-width="38" stroke-linecap="round"/>
  </g>

  <!-- Right main copy column -->
  <!-- Eyebrow pill -->
  <rect x="396" y="156" width="242" height="36" rx="18" fill="#FFF0F2" stroke="#FF5C6C" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="418" cy="174" r="5" fill="#FF5C6C"/>
  <text x="434" y="179" fill="#D93848" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.8">PURE LAN · ZERO CLOUD</text>

  <!-- Title -->
  <text x="396" y="264" fill="#14171F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', sans-serif" font-size="68" font-weight="800" letter-spacing="-1.6">妙投 · MiaoCast</text>

  <!-- Subtitle CN -->
  <text x="396" y="324" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', sans-serif" font-size="27" font-weight="600">基于 MiPlay 协议的跨端局域网音频投送 · 多音箱毫秒级同频</text>

  <!-- Subtitle EN -->
  <text x="396" y="366" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="20" font-weight="500">Cross-Platform Audio Casting via MiPlay Protocol (Android &amp; iOS) · Rust Sync Engine</text>

  <!-- Divider hairline -->
  <line x1="396" y1="406" x2="1156" y2="406" stroke="#0F172A" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Feature spec chips row -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <!-- Chip 1 -->
    <rect x="396" y="434" width="166" height="42" rx="12" fill="#F8F9FB" stroke="#0F172A" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="479" y="460" text-anchor="middle" fill="#1F2430">Rust L1 Core</text>

    <!-- Chip 2 -->
    <rect x="578" y="434" width="182" height="42" rx="12" fill="#F8F9FB" stroke="#0F172A" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="669" y="460" text-anchor="middle" fill="#1F2430">Android &amp; iOS</text>

    <!-- Chip 3 -->
    <rect x="776" y="434" width="194" height="42" rx="12" fill="#F8F9FB" stroke="#0F172A" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="873" y="460" text-anchor="middle" fill="#1F2430">Up to 63 Speakers</text>

    <!-- Chip 4 -->
    <rect x="986" y="434" width="170" height="42" rx="12" fill="#151820"/>
    <text x="1071" y="460" text-anchor="middle" fill="#F8FAFC">AGPL-3.0-only</text>
  </g>

  <!-- Bottom subtle repo footer -->
  <text x="122" y="534" fill="#64748B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500">github.com/JasirVoriya/miplay-sender</text>
  <text x="1156" y="534" text-anchor="end" fill="#94A3B8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500">mDNS · TCP 8899 · WFD RTSP · MPEG-TS/RTP · JNI &amp; C ABI</text>
</svg>
