<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">CozyTing (窝爱听) — Pure LAN Multi-Room Audio via MiPlay</title>
  <desc id="sp-desc">GitHub Social Preview card for CozyTing featuring the warm lit cozy house and sleeping cat icon on a clean ceramic background.</desc>

  <!-- Warm light background -->
  <rect width="1280" height="640" fill="#F6F3EE"/>

  <!-- Subtle architectural dot/line grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B1F2B" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Main framed card -->
  <rect x="56" y="56" width="1168" height="528" rx="32" fill="#FFFFFF" stroke="#1B1F2B" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Subtle left warm coral accent bar -->
  <rect x="56" y="136" width="6" height="368" rx="3" fill="#E56D48"/>

  <!-- Left brand icon mark (216x216 at x=122, y=156) -->
  <g transform="translate(122 156) scale(0.421875)">
    <rect x="2" y="2" width="508" height="508" rx="115" fill="#FDF4E6" stroke="#7A583A" stroke-opacity="0.16" stroke-width="4"/>
    <g transform="translate(141 128) scale(1.38) translate(-156 -142)">
      <path d="M 155 107 C 134 111 122 131 128 151 C 134 171 155 182 175 176 C 181 174 186 170 190 166 C 176 168 162 161 155 149 C 148 136 151 120 160 110 C 161 108 158 106 155 107 Z" fill="#F2B84B"/>
    </g>
    <g transform="translate(312 122) rotate(-10) scale(1.66) translate(-24 -26)">
      <path d="M 13 47 L 13 12 L 45 4 L 45 39" fill="none" stroke="#E56D48" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 13 12 L 45 4" fill="none" stroke="#E56D48" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="4.5" cy="49.5" rx="12" ry="9" transform="rotate(-18 4.5 49.5)" fill="#E56D48"/>
      <ellipse cx="36.5" cy="41.5" rx="12" ry="9" transform="rotate(-18 36.5 41.5)" fill="#E56D48"/>
    </g>
    <g transform="translate(387 98) rotate(16) scale(1.12) translate(-14 -24)">
      <path d="M 12 40 L 12 4 C 24 6 32 15 29 26" fill="none" stroke="#E56D48" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="4" cy="42.5" rx="12" ry="9" transform="rotate(-18 4 42.5)" fill="#E56D48"/>
    </g>
    <g transform="translate(256 296) scale(0.92) translate(-256 -256)">
      <path d="M 128 242 L 256 154 L 384 242 L 384 374 Q 384 422 336 422 L 176 422 Q 128 422 128 374 Z" fill="#5E5665"/>
      <rect x="323" y="156" width="35" height="68" rx="9" fill="#E56D48"/>
      <path d="M 107 254 L 236 160 Q 256 146 276 160 L 405 254" fill="none" stroke="#E56D48" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 184 304 A 72 72 0 0 1 328 304 L 328 360 Q 328 374 314 374 L 198 374 Q 184 374 184 360 Z" fill="#FFD166"/>
      <path d="M 184 355 L 328 355 L 328 360 Q 328 374 314 374 L 198 374 Q 184 374 184 360 Z" fill="#EE9B48"/>
      <path d="M 232 314 C 256 303 290 306 304 323 C 313 333 313 347 311 356 L 222 356 Z" fill="#20232F"/>
      <path d="M 204 318 L 207 297 Q 209 287 220 293 L 233 304 Z" fill="#20232F"/>
      <path d="M 260 318 L 257 297 Q 255 287 244 293 L 231 304 Z" fill="#20232F"/>
      <ellipse cx="232" cy="328" rx="31.5" ry="24" fill="#20232F"/>
      <ellipse cx="215" cy="355.5" rx="11.5" ry="9.5" fill="#20232F"/>
      <ellipse cx="243" cy="356" rx="11.5" ry="9.5" fill="#20232F"/>
      <path d="M 212 327 Q 218 334 224 327" fill="none" stroke="#FFD166" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M 240 327 Q 246 334 252 327" fill="none" stroke="#FFD166" stroke-width="4.2" stroke-linecap="round"/>
      <ellipse cx="232" cy="334.5" rx="3.5" ry="2.3" fill="#EF8B65"/>
      <path d="M 301 344 C 314 352 316 377 307 392 C 299 404 280 404 273 394" fill="none" stroke="#20232F" stroke-width="15.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right main copy column -->
  <!-- Eyebrow pill -->
  <rect x="396" y="156" width="242" height="36" rx="18" fill="#FFF2EB" stroke="#E56D48" stroke-opacity="0.38" stroke-width="1.5"/>
  <circle cx="418" cy="174" r="5" fill="#E56D48"/>
  <text x="434" y="179" fill="#C54E2A" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.8">PURE LAN · ZERO CLOUD</text>

  <!-- Title -->
  <text x="396" y="264" fill="#14171F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', sans-serif" font-size="68" font-weight="800" letter-spacing="-1.6">窝爱听 · CozyTing</text>

  <!-- Subtitle CN -->
  <text x="396" y="324" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', sans-serif" font-size="27" font-weight="600">基于 MiPlay 协议的跨端局域网音频投送 · 多音箱毫秒级同频</text>

  <!-- Subtitle EN -->
  <text x="396" y="366" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="20" font-weight="500">Cross-Platform Audio Casting via MiPlay Protocol (Android &amp; iOS) · Rust Sync Engine</text>

  <!-- Divider hairline -->
  <line x1="396" y1="406" x2="1156" y2="406" stroke="#1B1F2B" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Feature spec chips row -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <!-- Chip 1 -->
    <rect x="396" y="434" width="166" height="42" rx="12" fill="#F8F6F2" stroke="#1B1F2B" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="479" y="460" text-anchor="middle" fill="#1F2430">Rust L1 Core</text>

    <!-- Chip 2 -->
    <rect x="578" y="434" width="182" height="42" rx="12" fill="#F8F6F2" stroke="#1B1F2B" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="669" y="460" text-anchor="middle" fill="#1F2430">Android &amp; iOS</text>

    <!-- Chip 3 -->
    <rect x="776" y="434" width="194" height="42" rx="12" fill="#F8F6F2" stroke="#1B1F2B" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="873" y="460" text-anchor="middle" fill="#1F2430">Up to 63 Speakers</text>

    <!-- Chip 4 -->
    <rect x="986" y="434" width="170" height="42" rx="12" fill="#1B1F2B"/>
    <text x="1071" y="460" text-anchor="middle" fill="#FDF4E6">AGPL-3.0-only</text>
  </g>

  <!-- Bottom subtle repo footer -->
  <text x="122" y="534" fill="#64748B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="500">github.com/JasirVoriya/cozyting-releases</text>
  <text x="1156" y="534" text-anchor="end" fill="#94A3B8" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="500">mDNS · TCP 8899 · WFD RTSP · MPEG-TS/RTP · JNI &amp; C ABI</text>
</svg>
