name: Sync Public Docs & Pages to miaocast-releases

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README_EN.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "docs/**"
      - "scripts/generate-update-manifest.py"
      - ".github/workflows/sync-public-docs.yml"
  workflow_dispatch:

concurrency:
  group: sync-public-docs
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Whitelisted Public Docs -> JasirVoriya/miaocast-releases
    runs-on: ubuntu-latest
    steps:
      - name: Check PUBLIC_RELEASE_TOKEN configured
        id: guard
        env:
          TOKEN_PRESENT: ${{ secrets.PUBLIC_RELEASE_TOKEN != '' }}
        run: |
          if [[ "$TOKEN_PRESENT" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PUBLIC_RELEASE_TOKEN 未配置，跳过公开文档自动同步。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private source repository
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout public release repository
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: JasirVoriya/miaocast-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          ref: main
          path: dst

      - name: Sync whitelisted public docs (zero source code, preserve dst/.github)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          # 1. 白名单顶层公开文档（绝不拷贝任何源码目录或私有文件）
          for f in README.md README_EN.md CHANGELOG.md SECURITY.md CONTRIBUTING.md LICENSE; do
            if [[ -f "src/$f" ]]; then
              cp "src/$f" "dst/$f"
            else
              rm -f "dst/$f"
            fi
          done

          # 2. 同步 docs/（含 architecture.html、assets/ 与全部公开设计/兼容文档）
          mkdir -p dst/docs
          rsync -a --delete --exclude='.DS_Store' --exclude='._*' src/docs/ dst/docs/

          # 3. 同步静态 update.json 生成脚本
          mkdir -p dst/scripts
          cp src/scripts/generate-update-manifest.py dst/scripts/generate-update-manifest.py
          chmod +x dst/scripts/generate-update-manifest.py

          # 4. 将公开仓 README 中指向私仓 CI 徽章的链接替换为公开仓 Pages 徽章
          python3 - dst JasirVoriya/miaocast-releases <<'PY'
          import sys
          from pathlib import Path

          dst = Path(sys.argv[1])
          target_repo = sys.argv[2]
          owner, repo = target_repo.split("/", 1)
          pages_url = f"https://{owner.lower()}.github.io/{repo}/"

          for fname in ("README.md", "README_EN.md"):
              p = dst / fname
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8")
              for old_ci in (
                  '<a href="https://github.com/JasirVoriya/miaocast/actions/workflows/ci.yml"><img alt="CI" src="https://github.com/JasirVoriya/miaocast/actions/workflows/ci.yml/badge.svg"></a>',
                  '<a href="https://github.com/JasirVoriya/miplay-sender/actions/workflows/ci.yml"><img alt="CI" src="https://github.com/JasirVoriya/miplay-sender/actions/workflows/ci.yml/badge.svg"></a>',
              ):
                  text = text.replace(
                      old_ci,
                      f'<a href="https://github.com/{target_repo}/actions/workflows/pages.yml"><img alt="Pages & Update Feed" src="https://github.com/{target_repo}/actions/workflows/pages.yml/badge.svg"></a>',
                  )
              text = text.replace("https://jasirvoriya.github.io/miplay-sender/", pages_url)
              text = text.replace("https://jasirvoriya.github.io/miaocast/", pages_url)
              text = text.replace("https://github.com/JasirVoriya/miplay-sender/releases", f"https://github.com/{target_repo}/releases")
              text = text.replace("https://github.com/JasirVoriya/miaocast/releases", f"https://github.com/{target_repo}/releases")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Safety & privacy gate (block secrets or source dirs)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: dst
        run: |
          set -euo pipefail
          for forbidden in core android cli .local hiddenapi-stubs; do
            if [[ -e "$forbidden" ]]; then
              echo "::error::Forbidden directory detected in public staging: $forbidden"
              exit 1
            fi
          done
          if grep -rnE "ghp_|gho_|github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" . --exclude-dir=.git; then
            echo "::error::Potential credential pattern detected in public docs!"
            exit 1
          fi

      - name: Commit and push if changed
        if: steps.guard.outputs.enabled == 'true'
        working-directory: dst
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Public docs are already up to date; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHORT_SHA="${SRC_SHA:0:7}"
          git commit -m "docs: auto-sync public docs and Pages assets from miaocast@${SHORT_SHA}"
          git push origin main
