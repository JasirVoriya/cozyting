name: Deploy Architecture Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/architecture.html"
      - "docs/en/**"
      - "docs/ja/**"
      - "docs/robots.txt"
      - "docs/sitemap.xml"
      - "docs/llms.txt"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Docs Pages
    # Free 计划下私有仓库不支持 GitHub Pages；仓库公开（Public）后会自动启用部署
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp docs/index.html _site/index.html
          cp docs/architecture.html _site/architecture.html
          for locale_dir in en ja; do
            if [[ -d "docs/$locale_dir" ]]; then
              mkdir -p "_site/$locale_dir"
              cp -r "docs/$locale_dir/." "_site/$locale_dir/"
            fi
          done
          for seo_file in robots.txt sitemap.xml llms.txt; do
            if [[ -f "docs/$seo_file" ]]; then
              cp "docs/$seo_file" "_site/$seo_file"
            fi
          done
          cp -r docs/assets/* _site/assets/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
