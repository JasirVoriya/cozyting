name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/release.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "design/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/release.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      android: ${{ steps.filter.outputs.android }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute affected jobs
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base commit unavailable; running all CI jobs."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${BASE}" "${{ github.sha }}")"
          echo "Changed files:"
          echo "${CHANGED}"

          RUST="false"
          ANDROID="false"
          MACOS="false"
          if echo "${CHANGED}" | grep -Eq '^(Cargo\.(toml|lock)|core/|cli/|\.github/workflows/ci\.yml)'; then
            RUST="true"
          fi
          if echo "${CHANGED}" | grep -Eq '^(Cargo\.(toml|lock)|core/|android/|scripts/|\.github/workflows/ci\.yml)'; then
            ANDROID="true"
          fi
          if echo "${CHANGED}" | grep -Eq '^(Cargo\.(toml|lock)|core/|apple/|scripts/(build-macos|package-macos-dmg)\.sh|\.github/workflows/ci\.yml)'; then
            MACOS="true"
          fi

          echo "rust=${RUST}" >> "$GITHUB_OUTPUT"
          echo "android=${ANDROID}" >> "$GITHUB_OUTPUT"
          echo "macos=${MACOS}" >> "$GITHUB_OUTPUT"
          echo "Affected jobs -> rust=${RUST}, android=${ANDROID}, macos=${MACOS}"

  rust-core:
    name: Rust Core & CLI
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace unit tests
        run: cargo test --workspace

      - name: Build cozyting-cli (release)
        run: cargo build --release -p cozyting-cli

      - name: Check iOS C ABI header syntax (C11)
        if: hashFiles('core/include/cozyting_core.h') != ''
        run: clang -std=c11 -Wall -Wextra -Werror -fsyntax-only core/include/cozyting_core.h

  android-build-and-test:
    name: Android JNI, Lint & Unit Tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore cached 16KB-aligned Rust JNI library (arm64-v8a)
        id: jni-cache
        uses: actions/cache@v6
        with:
          path: android/app/src/main/jniLibs/arm64-v8a/libcozyting_core.so
          key: android-jni-so-arm64-v2-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'core/Cargo.toml', 'core/src/**') }}

      - name: Set up Rust toolchain (aarch64-linux-android)
        if: steps.jni-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        if: steps.jni-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        if: steps.jni-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build 16KB-aligned Rust JNI library (arm64-v8a)
        if: steps.jni-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT:-$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -1)}"
          echo "Using ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a --platform 29 -o android/app/src/main/jniLibs build --release -p cozyting-core --features jni

      - name: Verify 16KB ELF alignment on libcozyting_core.so
        run: |
          READELF_OUT="$(readelf -W -l android/app/src/main/jniLibs/arm64-v8a/libcozyting_core.so)"
          printf '%s\n' "$READELF_OUT" | grep -E 'Type|LOAD|Align'
          printf '%s\n' "$READELF_OUT" | awk '
            function hex2dec(s,    i, c, n, d) {
              sub(/^0[xX]/, "", s)
              if (length(s) == 0) return -1
              n = 0
              for (i = 1; i <= length(s); i++) {
                c = tolower(substr(s, i, 1))
                d = index("0123456789abcdef", c) - 1
                if (d < 0) return -1
                n = n * 16 + d
              }
              return n
            }
            $1 == "LOAD" {
              seen++
              val = hex2dec($NF)
              if (val < 16384 || (val % 16384) != 0) bad = 1
            }
            END { exit (seen > 0 && !bad) ? 0 : 1 }
          '

      - name: Install Android API 36 platform and build-tools
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android standardDebug unit tests, Lint (NewApi fatal) and Debug APK build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testStandardDebugUnitTest :app:lintStandardDebug :app:assembleStandardDebug

      - name: Upload standard debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: cozyting-standard-debug-apk
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          retention-days: 14
          if-no-files-found: error

  macos-build-and-test:
    name: macOS Shared SwiftPM Tests & App Build
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build XCFramework, run SwiftPM tests & build CozyTingMac
        run: |
          chmod +x scripts/build-macos.sh scripts/package-macos-dmg.sh
          ./scripts/build-macos.sh
