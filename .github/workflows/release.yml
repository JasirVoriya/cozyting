name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "手动发布的版本号标签（例如 v0.9.5）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Android API 36 platform and build-tools
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured in Secrets)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MIPLAY_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MIPLAY_RELEASE_STORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" ]]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 MIPLAY_RELEASE_KEYSTORE_BASE64 / MIPLAY_RELEASE_STORE_PASSWORD，本次将产出未签名 Release APK 与可安装的 Debug APK。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify Android APK
        env:
          MIPLAY_RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          MIPLAY_RELEASE_STORE_PASSWORD: ${{ secrets.MIPLAY_RELEASE_STORE_PASSWORD }}
          MIPLAY_RELEASE_KEY_ALIAS: ${{ secrets.MIPLAY_RELEASE_KEY_ALIAS }}
          MIPLAY_RELEASE_KEY_PASSWORD: ${{ secrets.MIPLAY_RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT:-$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -1)}"
          echo "Using ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          chmod +x android/gradlew scripts/build-release.sh scripts/verify-acceptance-apk.sh
          ./scripts/build-release.sh
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            cp android/app/build/outputs/apk/standard/release/app-standard-release.apk \
              "dist/miaocast-${TAG}-arm64-v8a.apk"
          else
            cp android/app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk \
              "dist/miaocast-${TAG}-arm64-v8a-unsigned.apk"
            (cd android && ./gradlew --no-daemon assembleStandardDebug)
            cp android/app/build/outputs/apk/standard/debug/app-standard-debug.apk \
              "dist/miaocast-${TAG}-arm64-v8a-debug.apk"
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*

  build-cli:
    name: Build miaocast-cli (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            ext: tar.gz
            bin: miaocast-cli
          - os: macos-latest
            label: macos-arm64
            ext: tar.gz
            bin: miaocast-cli
          - os: windows-latest
            label: windows-x86_64
            ext: zip
            bin: miaocast-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build miaocast-cli
        run: cargo build --release -p miaocast-cli

      - name: Package miaocast-cli archive
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          OUT="miaocast-cli-${TAG}-${{ matrix.label }}"
          mkdir -p "dist/${OUT}"
          cp "target/release/${{ matrix.bin }}" "dist/${OUT}/"
          cp LICENSE README.md "dist/${OUT}/"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "${OUT}.zip" "${OUT}")
          else
            tar -C dist -czf "dist/${OUT}.tar.gz" "${OUT}"
          fi
          rm -rf "dist/${OUT}"

      - name: Upload CLI release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.label }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Release Notes (CHANGELOG.md -> git log fallback)
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/extract-release-notes.py \
            --tag "${RELEASE_TAG}" \
            --changelog CHANGELOG.md \
            --out release-notes.md
          cat release-notes.md

      - name: Create GitHub Release (private archive)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MiaoCast (妙投) ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: release-assets/*

      - name: Check PUBLIC_RELEASE_TOKEN configured
        id: public_sync_guard
        env:
          TOKEN_PRESENT: ${{ secrets.PUBLIC_RELEASE_TOKEN != '' }}
        run: |
          if [[ "$TOKEN_PRESENT" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 PUBLIC_RELEASE_TOKEN，跳过同步至公开分发仓 JasirVoriya/miaocast-releases。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror Release to Public Repo (JasirVoriya/miaocast-releases)
        if: steps.public_sync_guard.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: JasirVoriya/miaocast-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MiaoCast (妙投) ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: release-assets/*
